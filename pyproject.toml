[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chaosprobe"
version = "1.0.0"
description = "Information backflow of a dephasing probe qubit as a diagnostic of many-body quantum chaos"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Degala Chenchupradeep" }]
dependencies = ["numpy", "scipy", "pandas", "matplotlib", "torch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
